    sdk: flutter
  
  # Networking
  dio: ^5.3.2
  
  # Secure Storage
  flutter_secure_storage: ^9.0.0
  
  # State Management
  flutter_bloc: ^8.1.3
  
  # JSON Serialization
  json_annotation: ^4.8.1
  
  # UI
  cupertino_icons: ^1.0.8
  google_fonts: ^6.1.0
  flutter_svg: ^2.0.9
  animations: ^2.0.9
  lottie: ^2.7.0
  
  # Networking
  retrofit: ^4.1.0
  logger: ^2.0.2+1
  
  # Local Storage
  hive_flutter: ^1.1.0
  # flutter_secure_storage: ^9.0.0
  
  # Authentication
  local_auth: ^2.1.6
  
  # Charts & Graphs
  fl_chart: ^0.66.0
  
  # PDF & Excel
  pdf: ^3.10.7
  printing: ^5.11.1
  excel: ^2.0.0
  
  # ⚠️ SUPPRIMEZ CES LIGNES (Firebase)
  # firebase_core: ^2.24.2
  # firebase_messaging: ^14.7.9
  # firebase_messaging_web: ^3.5.18
  
  # ⚠️ SUPPRIMEZ AUSSI (si présent)
  # flutter_local_notifications: ^17.0.0
  # timezone: ^0.9.2
  
  # Sharing
  share_plus: ^7.2.1
  
  # Utilities
  intl: ^0.18.1
  image_picker: ^1.0.7
  path_provider: ^2.1.2
  permission_handler: ^11.3.0
  
  # Navigation
  go_router: ^13.0.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.1
  build_runner: ^2.4.8
  json_serializable: ^6.7.1
  retrofit_generator: ^8.0.0

flutter:
